name: Windows

# Compila el TaskApp de 2025 con SwiftOpenUI (backend Win32) en Windows real,
# lo arranca y guarda capturas de la interfaz como artefacto.
on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      # Misma disposición que en local: TaskApp2025/ y swiftopenui/ juntas,
      # porque Package.swift usa .package(path: "../swiftopenui").
      - uses: actions/checkout@v4
        with:
          path: TaskApp2025
      - uses: actions/checkout@v4
        with:
          repository: frangarcj/SwiftOpenUI
          ref: uallps
          path: swiftopenui

      - uses: seanmiddleditch/gha-setup-vsdevenv@v5
      - uses: compnerd/gha-setup-swift@v0.3.0
        with:
          branch: swift-6.3.3-release
          tag: 6.3.3-RELEASE
      - run: swift --version

      - uses: actions/cache@v4
        with:
          path: TaskApp2025/.build
          key: windows-build-${{ hashFiles('TaskApp2025/Package.resolved') }}-${{ hashFiles('swiftopenui/Sources/**') }}
          restore-keys: windows-build-

      - name: Compilar
        working-directory: TaskApp2025
        run: swift build --product TaskApp

      - name: Arrancar y probar la interfaz
        working-directory: TaskApp2025
        run: |
          . .github/scripts/ui.ps1
          $bin = swift build --product TaskApp --show-bin-path
          $app = Start-Process -FilePath "$bin\TaskApp.exe" -WorkingDirectory $bin -PassThru `
              -WindowStyle Minimized -RedirectStandardOutput app-out.txt -RedirectStandardError app-err.txt
          Start-Sleep -Seconds 8
          if ($app.HasExited) { Write-Host "La app terminó con código $($app.ExitCode)"; exit 1 }
          $w = Get-AppWindow
          Save-Screenshot "1-inicio"; Save-Controls $w "1-inicio"
          if (Click-Text $w "Tareas") { Save-Screenshot "2-tareas"; Save-Controls $w "2-tareas" }
          if (Click-Text $w "Ajustes") { Save-Screenshot "3-ajustes"; Save-Controls $w "3-ajustes" }
          if ($app.HasExited) { Write-Host "La app terminó con código $($app.ExitCode)" } else { Stop-Process -Id $app.Id }
          Get-Content app-out.txt, app-err.txt -ErrorAction SilentlyContinue | Select-Object -Last 40

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui
          path: |
            TaskApp2025/shots
            TaskApp2025/app-*.txt
