name: Windows

# Compila el TaskApp de 2025 con SwiftOpenUI (backend Win32) en Windows real,
# lo arranca y guarda capturas de la interfaz como artefacto.
on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      # Misma disposición que en local: TaskApp2025/ y swiftopenui/ juntas,
      # porque Package.swift usa .package(path: "../swiftopenui").
      - uses: actions/checkout@v4
        with:
          path: TaskApp2025
      - uses: actions/checkout@v4
        with:
          repository: frangarcj/SwiftOpenUI
          ref: uallps
          path: swiftopenui

      - uses: seanmiddleditch/gha-setup-vsdevenv@v5
      - uses: compnerd/gha-setup-swift@v0.3.0
        with:
          branch: swift-6.3.3-release
          tag: 6.3.3-RELEASE
      - run: swift --version

      - uses: actions/cache@v4
        with:
          path: TaskApp2025/.build
          key: windows-build-${{ hashFiles('TaskApp2025/Package.resolved') }}-${{ hashFiles('swiftopenui/Sources/**') }}
          restore-keys: windows-build-

      - name: Compilar
        working-directory: TaskApp2025
        run: swift build --product TaskApp

      - name: Arrancar y probar la interfaz
        working-directory: TaskApp2025
        run: |
          . .github/scripts/ui.ps1
          $bin = swift build --product TaskApp --show-bin-path
          $app = Start-App "$bin\TaskApp.exe" "taskapp"
          Save-Screenshot "1-inicio"
          if (-not $app.HasExited) {
              $w = Get-AppWindow $app.Id
              Save-Screenshot "2-ventana"; Save-Controls $w "2-ventana"
              if (Click-Text $w "Tareas") { Save-Screenshot "3-tareas"; Save-Controls $w "3-tareas" }
              if (Click-Text $w "Ajustes") { Save-Screenshot "4-ajustes"; Save-Controls $w "4-ajustes" }
          }
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          Get-Process -Name WerFault -ErrorAction SilentlyContinue | Stop-Process -Force

      # Para comparar: un ejemplo del propio SwiftOpenUI con el mismo backend.
      - name: Ejemplo HelloWorld de SwiftOpenUI
        if: always()
        working-directory: swiftopenui
        run: |
          . ../TaskApp2025/.github/scripts/ui.ps1
          swift build --product HelloWorld
          $bin = swift build --product HelloWorld --show-bin-path
          $p = Start-App "$bin\HelloWorld.exe" "helloworld"
          Save-Screenshot "5-helloworld"
          New-Item -ItemType Directory -Force -Path ../TaskApp2025/shots | Out-Null
          Move-Item shots/*.png ../TaskApp2025/shots/ -Force
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui
          path: |
            TaskApp2025/shots
            TaskApp2025/*-out.txt
            TaskApp2025/*-err.txt
            swiftopenui/*-out.txt
            swiftopenui/*-err.txt
