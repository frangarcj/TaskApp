name: Windows

# Compila el TaskApp de 2025 con SwiftOpenUI (backend Win32) en Windows real,
# lo arranca y guarda capturas de la interfaz como artefacto.
on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      # Misma disposición que en local: TaskApp2025/ y swiftopenui/ juntas,
      # porque Package.swift usa .package(path: "../swiftopenui").
      - uses: actions/checkout@v4
        with:
          path: TaskApp2025
      - uses: actions/checkout@v4
        with:
          repository: frangarcj/SwiftOpenUI
          ref: uallps
          path: swiftopenui

      - uses: seanmiddleditch/gha-setup-vsdevenv@v5
      - uses: compnerd/gha-setup-swift@v0.3.0
        with:
          branch: swift-6.3.3-release
          tag: 6.3.3-RELEASE
      - run: swift --version

      - uses: actions/cache@v4
        with:
          path: TaskApp2025/.build
          key: windows-build-${{ hashFiles('TaskApp2025/Package.resolved') }}-${{ hashFiles('swiftopenui/Sources/**') }}
          restore-keys: windows-build-

      - name: Compilar
        working-directory: TaskApp2025
        run: swift build --product TaskApp

      - name: Arrancar y probar la interfaz
        working-directory: TaskApp2025
        run: |
          . .github/scripts/ui.ps1
          $bin = swift build --product TaskApp --show-bin-path
          $env:SWIFTOPENUI_TRACE_FILE = "$PWD\trace.txt"
          $app = Start-App "$bin\TaskApp.exe" "taskapp"
          Save-Screenshot "1-inicio"
          if (-not $app.HasExited) {
              $w = Get-AppWindow $app.Id
              Snap $w "2-ventana"
              if (Click-Text $w "Tareas") {
                  Snap $w "3-tareas"
                  # "Añadir Tarea" dibuja su texto (no es un control con texto): por posición.
                  Click-At 833 44; Snap $w "4-anadida"
                  # Detalle: no debe volver a la lista al editar.
                  if (Click-Text $w "Llamar a mamá") {
                      Snap $w "5-detalle"
                      if (Click-Text $w "Completada") { Snap $w "6-completada" }
                      if (Click-Text $w "Vencimiento") { Snap $w "6b-fecha" }
                      if (Click-Text $w "Recordatorio") { Snap $w "6c-recordatorio" }
                      if (Click-Class $w "Edit") { Send-Text "{END} hoy"; Snap $w "7-titulo" }
                      if (Click-Text $w "← Back") { Snap $w "8-lista" }
                  }
                  # Borrar con el menú contextual: clic derecho y primera opción.
                  if (Click-Text $w "Hacer ejercicio" -Right) {
                      Snap $w "8b-menu"
                      Send-Text "{DOWN}{ENTER}"; Snap $w "8c-borrada"
                  }
              }
              if (Click-Text $w "Ajustes") {
                  Snap $w "9-ajustes"
                  if (Click-Text $w "Show Priorities") { Snap $w "9b-desmarcado" }
              }
          }
          # Los ajustes deben seguir desmarcados tras reiniciar la app.
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force; Start-Sleep -Seconds 2 }
          $app = Start-App "$bin\TaskApp.exe" "taskapp2"
          if (-not $app.HasExited) {
              $w = Get-AppWindow $app.Id
              if (Click-Text $w "Ajustes") { Snap $w "10-ajustes-tras-reinicio" }
          }
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          Get-Process -Name WerFault -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "--- traza"; Get-Content trace.txt -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui
          path: |
            TaskApp2025/shots
            TaskApp2025/trace.txt
            TaskApp2025/*-out.txt
            TaskApp2025/*-err.txt
